services:
  - type: web
    name: vibepro-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: vibepro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: VIBEPRO_SIGNING_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/vibepro.db
      - key: CORS_ORIGINS
        value: ""
      - key: VERSION
        value: latest
      - key: PORT
        value: 10000
