[project]
name = "vibepro-api"
version = "1.0.0"
description = "Signed VibePro engine registry and website"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "cryptography>=44,<47",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "slowapi>=0.1.9,<1",
]

[tool.vercel]
entrypoint = "backend.app:app"
